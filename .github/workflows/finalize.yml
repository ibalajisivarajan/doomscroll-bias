# Scoring, QC, the final preregistered analysis, and the two-coder manual
# validation agreement all run automatically once collection is complete and
# both coder worksheets are filled -- none of that is identity-revealing.
#
# PUBLIC-RELEASE GATE: creating the git tag / GitHub Release, and
# reserving+publishing the Zenodo DOI, are held behind a manual
# workflow_dispatch confirmation (confirm_public_release). Those steps create
# new, search-indexable public artifacts (a titled GitHub Release, a
# published Zenodo DOI record) under this real, author-identified repo. Until
# FAccT's double-anonymous review window has closed, firing them automatically
# the moment the CSV is committed would let a reviewer find the study and the
# author's identity via a web search, independent of anything the paper
# itself links. Run this workflow manually with confirm_public_release=true
# only once that's no longer a concern (post-decision / camera-ready).
name: finalize-study

on:
  workflow_run:
    workflows: ["run"]
    types: [completed]
  workflow_dispatch:
    inputs:
      confirm_public_release:
        description: >-
          Set true only when it is safe to create public, search-indexable
          release artifacts (GitHub Release, published Zenodo DOI) under the
          real author-identified repo -- i.e. after FAccT's double-anonymous
          review window has closed. Leave false/unset during the anonymous
          submission period.
        type: boolean
        default: false
  push:
    paths:
      - "results/tables/manual_validation_50_coder_a.csv"
      - "results/tables/manual_validation_50_coder_b.csv"

permissions:
  contents: write
  actions: write

concurrency:
  group: doomscroll-finalization
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare final freeze and check release gate
        id: prep
        run: python src/finalize_study.py prepare --github-output "$GITHUB_OUTPUT"

      - name: Stop cleanly before 7,200
        if: steps.prep.outputs.complete != 'true'
        run: echo "Collection is not complete yet; nothing to finalize."

      - name: Commit frozen final-analysis state
        if: steps.prep.outputs.complete == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/final results/tables CITATION.cff
          if [ -d paper ]; then git add paper; fi
          if git diff --cached --quiet; then
            echo "No finalization changes to commit"
          else
            git commit -m "results: freeze complete 7,200-response corpus"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Human-validation gate
        if: steps.prep.outputs.complete == 'true' && steps.prep.outputs.manual_ready != 'true'
        run: |
          echo "Collection is frozen, but manual validation is only ${{ steps.prep.outputs.manual_coded }}/50 (slower of the two coders)."
          echo "Two independent coders must each fill action_category for all 50 rows:"
          echo "  results/tables/manual_validation_50_coder_a.csv"
          echo "  results/tables/manual_validation_50_coder_b.csv"
          echo "Each coder works blind to the other's file and to the automated classifier."
          echo "This workflow will resume automatically once both files are committed and complete."

      - name: Upload blinded validation worksheets
        if: steps.prep.outputs.complete == 'true' && steps.prep.outputs.manual_ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: manual-validation-50
          path: |
            results/tables/manual_validation_50_coder_a.csv
            results/tables/manual_validation_50_coder_b.csv
          retention-days: 90

      - name: Compute manual-validation agreement
        if: steps.prep.outputs.complete == 'true' && steps.prep.outputs.manual_ready == 'true'
        run: python src/manual_validation_agreement.py

      - name: Commit manual-validation results
        if: steps.prep.outputs.complete == 'true' && steps.prep.outputs.manual_ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/final \
            results/tables/manual_validation_50_coder_a.csv \
            results/tables/manual_validation_50_coder_b.csv \
            results/tables/manual_validation_50_key.csv
          if ! git diff --cached --quiet; then
            git commit -m "results: add preregistered manual-validation agreement"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      # --- Public-release gate -------------------------------------------
      # Everything below here creates new, search-indexable public artifacts
      # under the real, author-identified repo (a titled GitHub Release, a
      # published Zenodo DOI). It only runs on a manual workflow_dispatch
      # with confirm_public_release=true, so it never fires just because the
      # CSVs were committed. See the header comment for why.
      - name: Public-release gate not confirmed
        if: >-
          steps.prep.outputs.complete == 'true' && steps.prep.outputs.manual_ready == 'true' &&
          !(github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_public_release == 'true')
        run: |
          echo "Manual validation is complete and agreement has been committed."
          echo "Public release (GitHub tag/Release + Zenodo DOI) is held back."
          echo "Run this workflow manually with confirm_public_release=true when it is"
          echo "safe to create public, search-indexable, author-identified release artifacts"
          echo "(e.g. after the FAccT double-anonymous review window has closed)."

      - name: Reserve Zenodo DOI
        if: >-
          steps.prep.outputs.complete == 'true' && steps.prep.outputs.manual_ready == 'true' &&
          github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_public_release == 'true'
        id: zenodo_reserve
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_API_URL: ${{ vars.ZENODO_API_URL }}
        run: |
          python src/zenodo_release.py \
            --github-output "$GITHUB_OUTPUT" \
            reserve

      - name: Write DOI into release metadata
        if: >-
          steps.prep.outputs.complete == 'true' && steps.prep.outputs.manual_ready == 'true' &&
          github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_public_release == 'true'
        env:
          DOI: ${{ steps.zenodo_reserve.outputs.doi }}
        run: |
          TAG="study-final-v1.0.0"
          python src/finalize_study.py write-release-metadata \
            --doi "$DOI" \
            --zenodo-url "https://zenodo.org/doi/$DOI" \
            --tag "$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CITATION.cff paper/RELEASE_METADATA.md results/final/release.json
          if ! git diff --cached --quiet; then
            git commit -m "release: record reserved Zenodo DOI"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Create immutable Git tag and release archive
        if: >-
          steps.prep.outputs.complete == 'true' && steps.prep.outputs.manual_ready == 'true' &&
          github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_public_release == 'true'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DOI: ${{ steps.zenodo_reserve.outputs.doi }}
        run: |
          TAG="study-final-v1.0.0"
          git fetch origin main --tags
          git checkout main
          git pull --ff-only origin main
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git tag -a "$TAG" -m "Frozen final release: 7,200 responses"
            git push origin "$TAG"
          fi
          ARCHIVE="doomscroll-bias-$TAG.tar.gz"
          git archive --format=tar.gz --prefix="doomscroll-bias-$TAG/" -o "$ARCHIVE" "$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" \
              --title "Doomscroll Bias Study — Final Frozen Release" \
              --notes "Final preregistered study release. 7,200 model responses, final QC/analysis, and 50-output manual validation. Reserved Zenodo DOI: https://doi.org/$DOI. OSF preregistration: https://osf.io/ndvw8/"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Archive GitHub release to Zenodo and publish DOI
        if: >-
          steps.prep.outputs.complete == 'true' && steps.prep.outputs.manual_ready == 'true' &&
          github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_public_release == 'true'
        id: zenodo_publish
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_API_URL: ${{ vars.ZENODO_API_URL }}
        run: |
          python src/zenodo_release.py \
            --github-output "$GITHUB_OUTPUT" \
            publish \
            --deposit-id "${{ steps.zenodo_reserve.outputs.deposit_id }}" \
            --archive "${{ steps.release.outputs.archive }}" \
            --tag "${{ steps.release.outputs.tag }}"

      - name: Verify DOI and publish final links
        if: >-
          steps.prep.outputs.complete == 'true' && steps.prep.outputs.manual_ready == 'true' &&
          github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_public_release == 'true'
        env:
          RESERVED_DOI: ${{ steps.zenodo_reserve.outputs.doi }}
          PUBLISHED_DOI: ${{ steps.zenodo_publish.outputs.published_doi }}
          ZENODO_URL: ${{ steps.zenodo_publish.outputs.zenodo_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$RESERVED_DOI" = "$PUBLISHED_DOI"
          TAG="${{ steps.release.outputs.tag }}"
          gh release edit "$TAG" \
            --notes "Final preregistered study release. 7,200 model responses, final QC/analysis, and 50-output manual validation. Zenodo DOI: https://doi.org/$PUBLISHED_DOI. Zenodo: $ZENODO_URL. OSF preregistration: https://osf.io/ndvw8/"
          python src/finalize_study.py write-release-metadata \
            --doi "$PUBLISHED_DOI" \
            --zenodo-url "$ZENODO_URL" \
            --tag "$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CITATION.cff paper/RELEASE_METADATA.md results/final/release.json
          if ! git diff --cached --quiet; then
            git commit -m "release: publish final Zenodo DOI and archival links"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Stop daily collection workflow after archival release
        if: >-
          steps.prep.outputs.complete == 'true' && steps.prep.outputs.manual_ready == 'true' &&
          github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_public_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable run.yml

      - name: Final package artifact
        if: steps.prep.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: final-study-package
          path: |
            results/final/**
            results/tables/results.md
            results/tables/manual_validation_50_coder_a.csv
            results/tables/manual_validation_50_coder_b.csv
            results/tables/manual_validation_50_key.csv
            paper/RELEASE_METADATA.md
          if-no-files-found: warn
          retention-days: 90
