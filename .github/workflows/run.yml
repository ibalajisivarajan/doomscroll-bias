# Collection + analysis for the doomscroll-bias audit.
#
# Daily automatic collection plus optional manual dispatch. Every response is
# cached separately, committed to main, and skipped on later dispatches.

name: run

on:
  schedule:
    # Primary daily collection at 4:00 PM PST (UTC-8, fixed offset -- cron has
    # no DST awareness, so this drifts to 5:00 PM PDT during daylight saving)
    # plus a one-hour-later backup. GitHub documents that scheduled events can
    # be delayed or, under sufficient load, dropped. The persisted per-model
    # daily counters make the backup safe: if the primary already consumed
    # today's allowance, the backup makes no extra model calls.
    - cron: "0 0 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      per_model_limit:
        description: >-
          Max uncached calls per model this dispatch. Default 175 matches the
          per-model free-tier safety cap while staying below the verified
          200K tokens/day/model Groq limit using smoke-run token usage.
        required: false
        default: "175"
        type: string
      allow_unlocked:
        description: "Run even though config/protocol.yaml has locked: false (smoke tests only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: doomscroll-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore response cache
        uses: actions/cache@v4
        with:
          path: results/raw
          key: raw-${{ github.run_id }}
          restore-keys: |
            raw-

      - name: Report starting state
        run: |
          mkdir -p results/raw results/tables
          echo "cached responses on entry: $(find results/raw -name '*.json' | wc -l)"

      - name: Check collection completion
        id: progress
        run: |
          python - <<'PY'
          import pathlib, yaml
          cfg = yaml.safe_load(pathlib.Path("config/protocol.yaml").read_text())
          target = int(cfg["design"]["total_calls"])
          cached = len(list(pathlib.Path("results/raw").glob("*.json")))
          complete = cached >= target
          print(f"cached={cached} target={target} complete={complete}")
          import os
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"complete={'true' if complete else 'false'}\n")
          PY

      # run.py exits 0 for SUCCESS, CAPPED_CLEAN and PARTIAL_SUCCESS (a
      # productive dispatch that hit its daily cap and/or had an isolated
      # per-cell failure), and 1 only for FAILURE (every attempted call this
      # dispatch failed -- the signature of a broken credential or slot, not
      # bad luck on one vignette). That exit code is what lets the
      # score/QC/Notion steps below run via GitHub's implicit success() gate:
      # a single hard-failed cell (as in run 35422141274) no longer skips
      # them. `id:` lets the Notion-sync step read back which status this
      # slot actually finished with, since job.status alone would just say
      # "success" for both a clean run and a partial one.
      - name: Collect slot A responses
        id: collect_a
        if: steps.progress.outputs.complete != 'true'
        env:
          MODEL_A_API_KEY_GROQ: ${{ secrets.MODEL_A_API_KEY_GROQ }}
          MODEL_B_API_KEY_GROQ: ${{ secrets.MODEL_B_API_KEY_GROQ }}
          MODEL_C_API_KEY_OR: ${{ secrets.MODEL_C_API_KEY_OR }}
        run: |
          ARGS="--model A"
          LIMIT="${{ github.event.inputs.per_model_limit }}"
          LIMIT="${LIMIT:-175}"
          ARGS="$ARGS --limit $LIMIT"
          if [ "${{ github.event.inputs.allow_unlocked }}" = "true" ]; then
            ARGS="$ARGS --allow-unlocked"
          fi
          echo "python src/run.py $ARGS"
          python src/run.py $ARGS

      - name: Collect slot B responses
        id: collect_b
        if: steps.progress.outputs.complete != 'true' && always()
        env:
          MODEL_A_API_KEY_GROQ: ${{ secrets.MODEL_A_API_KEY_GROQ }}
          MODEL_B_API_KEY_GROQ: ${{ secrets.MODEL_B_API_KEY_GROQ }}
          MODEL_C_API_KEY_OR: ${{ secrets.MODEL_C_API_KEY_OR }}
        run: |
          ARGS="--model B"
          LIMIT="${{ github.event.inputs.per_model_limit }}"
          LIMIT="${LIMIT:-175}"
          ARGS="$ARGS --limit $LIMIT"
          if [ "${{ github.event.inputs.allow_unlocked }}" = "true" ]; then
            ARGS="$ARGS --allow-unlocked"
          fi
          echo "python src/run.py $ARGS"
          python src/run.py $ARGS

      - name: Persist per-model daily counters
        if: steps.progress.outputs.complete != 'true' && always()
        continue-on-error: true
        run: |
          if ! compgen -G "results/.daily_count_*.json" > /dev/null; then
            echo "no per-model daily counter files yet; nothing to persist"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/.daily_count_*.json
          if git diff --cached --quiet; then
            echo "daily counters unchanged"
            exit 0
          fi
          git commit -m "counter: dispatch ${{ github.run_id }}"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      # Runs before scoring/QC/analysis on purpose. Those steps can fail on
      # code bugs unrelated to collection; until this step exists, a raw
      # response landed on disk (real, already-spent Groq quota) had no
      # durable home except results/raw, saved only into an actions/cache
      # entry that a later run's restore-key lookup might not even hit
      # (cache entries are evicted after 7 days unused, and the 10GB/repo
      # cache budget is shared across every workflow in the repo). Git is
      # the authoritative checkpoint; the cache is a speed optimisation on
      # top of it, not instead of it. always() + continue-on-error: true
      # for the same reason as the counter-persist step above: a push race
      # here must never cascade into skipping score/analyse on a run that
      # otherwise succeeded.
      - name: Commit raw results to main
        if: steps.progress.outputs.complete != 'true' && always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A results/raw
          if git diff --cached --quiet; then
            echo "no new raw responses to commit"
            exit 0
          fi
          git commit -m "raw: dispatch ${{ github.run_id }} ($(find results/raw -name '*.json' | wc -l) files cached)"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      - name: Score responses
        if: steps.progress.outputs.complete != 'true'
        run: python src/score.py

      - name: Check known-answer controls
        if: steps.progress.outputs.complete != 'true'
        run: python src/control_check.py

      - name: Refresh seeded manual-validation sample
        if: steps.progress.outputs.complete != 'true'
        run: python src/sample_manual_validation.py

      - name: Run preregistered analysis only when collection is complete
        if: steps.progress.outputs.complete != 'true'
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, yaml
          cfg = yaml.safe_load(pathlib.Path("config/protocol.yaml").read_text())
          target = int(cfg["design"]["total_calls"])
          cached = len(list(pathlib.Path("results/raw").glob("*.json")))
          if cached < target:
              print(f"collection incomplete ({cached}/{target}); skipping inferential analysis")
              raise SystemExit(0)
          print(f"collection complete ({cached}/{target}); running preregistered analysis")
          subprocess.run([sys.executable, "src/analyze.py"], check=True)
          PY

      - name: Commit results to main
        if: steps.progress.outputs.complete != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A results
          if git diff --cached --quiet; then
            echo "no result changes to commit"
            exit 0
          fi
          git commit -m "results: collection run ${{ github.run_number }} ($(find results/raw -name '*.json' | wc -l) responses cached)"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      # job.status alone collapses "clean day" and "partial day (one failed
      # cell, cap safely exhausted)" into the same "success" -- both exit the
      # job 0 now. slotA/slotB carry what src/run.py's classify_run_status()
      # actually decided (SUCCESS / PARTIAL_SUCCESS / CAPPED_CLEAN / FAILURE
      # / SKIPPED if collection was already complete), so notion_sync.py can
      # tell those apart in the Production Runs "Status" column.
      - name: Sync live dashboard and run history to Notion
        if: steps.progress.outputs.complete != 'true' && always()
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: |
          python src/notion_sync.py \
            --note "dispatch #${{ github.run_number }} (${{ job.status }}), trigger=${{ github.event_name }}, slotA=${{ steps.collect_a.outputs.status || 'SKIPPED' }}, slotB=${{ steps.collect_b.outputs.status || 'SKIPPED' }}, per_model_limit='${{ github.event.inputs.per_model_limit || '175' }}', allow_unlocked=${{ github.event.inputs.allow_unlocked || 'false' }}"

      - name: Upload tables and figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-tables-run${{ github.run_number }}
          path: |
            results/tables/**
          if-no-files-found: warn
          retention-days: 90
