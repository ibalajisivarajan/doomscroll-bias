# Collection + analysis for the doomscroll-bias audit.
#
# Manual-only and resumable by design. Every response is cached separately,
# committed to main, and skipped on later dispatches.

name: run

on:
  workflow_dispatch:
    inputs:
      per_model_limit:
        description: >-
          Max uncached calls per model this dispatch. Default 150 is sized to
          stay comfortably under the verified 200K tokens/day/model Groq limit
          using smoke-run token usage, while leaving headroom for retries.
        required: false
        default: "150"
        type: string
      allow_unlocked:
        description: "Run even though config/protocol.yaml has locked: false (smoke tests only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: doomscroll-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore response cache
        uses: actions/cache@v4
        with:
          path: results/raw
          key: raw-${{ github.run_id }}
          restore-keys: |
            raw-

      - name: Report starting state
        run: |
          mkdir -p results/raw results/tables
          echo "cached responses on entry: $(find results/raw -name '*.json' | wc -l)"

      - name: Collect slot A responses
        env:
          MODEL_A_API_KEY_GROQ: ${{ secrets.MODEL_A_API_KEY_GROQ }}
          MODEL_B_API_KEY_GROQ: ${{ secrets.MODEL_B_API_KEY_GROQ }}
          MODEL_C_API_KEY_OR: ${{ secrets.MODEL_C_API_KEY_OR }}
        run: |
          ARGS="--model A"
          if [ -n "${{ inputs.per_model_limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.per_model_limit }}"
          fi
          if [ "${{ inputs.allow_unlocked }}" = "true" ]; then
            ARGS="$ARGS --allow-unlocked"
          fi
          echo "python src/run.py $ARGS"
          python src/run.py $ARGS

      - name: Collect slot B responses
        env:
          MODEL_A_API_KEY_GROQ: ${{ secrets.MODEL_A_API_KEY_GROQ }}
          MODEL_B_API_KEY_GROQ: ${{ secrets.MODEL_B_API_KEY_GROQ }}
          MODEL_C_API_KEY_OR: ${{ secrets.MODEL_C_API_KEY_OR }}
        run: |
          ARGS="--model B"
          if [ -n "${{ inputs.per_model_limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.per_model_limit }}"
          fi
          if [ "${{ inputs.allow_unlocked }}" = "true" ]; then
            ARGS="$ARGS --allow-unlocked"
          fi
          echo "python src/run.py $ARGS"
          python src/run.py $ARGS

      - name: Persist daily counter
        if: always()
        continue-on-error: true
        run: |
          if [ ! -f results/.daily_count.json ]; then
            echo "no daily counter file yet; nothing to persist"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/.daily_count.json
          if git diff --cached --quiet; then
            echo "daily counter unchanged"
            exit 0
          fi
          git commit -m "counter: dispatch ${{ github.run_id }}"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      - name: Score responses
        run: python src/score.py

      - name: Check known-answer controls
        run: python src/control_check.py

      - name: Refresh seeded manual-validation sample
        run: python src/sample_manual_validation.py

      - name: Analyse
        run: python src/analyze.py

      - name: Commit results to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A results
          if git diff --cached --quiet; then
            echo "no result changes to commit"
            exit 0
          fi
          git commit -m "results: collection run ${{ github.run_number }} ($(find results/raw -name '*.json' | wc -l) responses cached)"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      - name: Sync live dashboard and run history to Notion
        if: always()
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: |
          python src/notion_sync.py \
            --note "dispatch #${{ github.run_number }} (${{ job.status }}), per_model_limit='${{ inputs.per_model_limit }}', allow_unlocked=${{ inputs.allow_unlocked }}"

      - name: Upload tables and figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-tables-run${{ github.run_number }}
          path: |
            results/tables/**
          if-no-files-found: warn
          retention-days: 90
